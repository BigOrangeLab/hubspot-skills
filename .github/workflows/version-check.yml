name: Skill version freshness check

on:
    schedule:
        - cron: "0 9 * * 1" # Every Monday at 09:00 UTC
    workflow_dispatch: # Allow manual runs

permissions:
    issues: write
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Self-check version comparison rules
              run: node .github/scripts/check-skill-versions.mjs --self-check

            - name: Fetch current upstream versions
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: node .github/scripts/check-skill-versions.mjs > version-report.json

            - name: Create or update freshness issue
              uses: actions/github-script@v7
              with:
                  script: |
                      const { readFileSync } = require('fs');
                      const rows = JSON.parse(readFileSync('version-report.json', 'utf8'));
                      const date = new Date().toISOString().split('T')[0];

                      // Staleness is decided by check-skill-versions.mjs so the
                      // version rules live in one testable place.
                      let table = '| Skill | Written | Tool | Written against | Current upstream |\n';
                      table    += '|---|---|---|---|---|\n';
                      for (const r of rows) {
                        const flag = r.stale ? ' ⚠️' : '';
                        const note = r.note ? `<br>_${r.note}_` : '';
                        table += `| \`${r.skill}\` | ${r.writtenDate ?? '—'} | \`${r.tool}\` | \`${r.writtenVersion}\` | \`${r.current}\`${flag}${note} |\n`;
                      }

                      const staleCount = rows.filter(r => r.stale).length;

                      const summary = staleCount > 0
                        ? `⚠️ **${staleCount} tool(s) have drifted** beyond the version the skill was written against.`
                        : '✅ All tracked tools are within the expected version range of when the skills were written.';

                      const body = [
                        `## Skill version freshness — ${date}`,
                        '',
                        summary,
                        '',
                        'A ⚠️ flag means the upstream version has advanced beyond `written_against`. Review the skill and update its `written_against` and `written` fields after refreshing.',
                        '',
                        '**Staleness rules:**',
                        '- `hubspot-api` — current GA date version derived from the [public OpenAPI spec collection](https://github.com/HubSpot/HubSpot-public-api-spec-collection); flags when a newer GA date ships',
                        '- `spec-ga: <family>` — watches a family the skill documents as having *no* GA date version; flags the moment one appears',
                        '- `hubspot-cms-vscode` — flag on minor version bump (extension minor releases add new HubL functions/tags)',
                        '- All other tools — flag on major version bump',
                        '',
                        'Rows showing `no source` have no public release feed and must be checked manually. Deprecated skills are excluded.',
                        '',
                        table,
                        '',
                        '---',
                        '*Auto-updated weekly by the [version-check workflow](../../actions/workflows/version-check.yml). Trigger a manual run from the Actions tab at any time.*',
                      ].join('\n');

                      const LABEL = 'skill-freshness';

                      // Ensure the label exists
                      try {
                        await github.rest.issues.createLabel({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          name: LABEL,
                          color: 'E4E669',
                          description: 'Automated skill version freshness tracking',
                        });
                      } catch { /* label already exists */ }

                      // Find an existing open issue with this label
                      const { data: existing } = await github.rest.issues.listForRepo({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        labels: LABEL,
                        state: 'open',
                        per_page: 1,
                      });

                      let issueNumber;
                      if (existing.length) {
                        await github.rest.issues.update({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: existing[0].number,
                          title: 'Skill version freshness report',
                          body,
                        });
                        issueNumber = existing[0].number;
                        core.info(`Updated issue #${issueNumber}`);
                      } else {
                        const { data: created } = await github.rest.issues.create({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          title: 'Skill version freshness report',
                          body,
                          labels: [LABEL],
                        });
                        issueNumber = created.number;
                        core.info(`Created issue #${issueNumber}`);
                      }

                      // Post a comment on every run so the issue has a visible
                      // history of how the stale count changed over time.
                      await github.rest.issues.createComment({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: issueNumber,
                        body: `**Weekly check — ${date}**\n\n${summary}`,
                      });
