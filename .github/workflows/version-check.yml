name: Skill version freshness check

on:
    schedule:
        - cron: "0 9 * * 1" # Every Monday at 09:00 UTC
    workflow_dispatch: # Allow manual runs

permissions:
    issues: write
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Fetch current upstream versions
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: node .github/scripts/check-skill-versions.mjs > version-report.json

            - name: Create or update freshness issue
              uses: actions/github-script@v7
              with:
                  script: |
                      const { readFileSync } = require('fs');
                      const rows = JSON.parse(readFileSync('version-report.json', 'utf8'));
                      const date = new Date().toISOString().split('T')[0];

                      // hubspot-cms-vscode uses semver (MAJOR.MINOR.PATCH).
                      // Flag when the MINOR version advances — extension minor releases
                      // frequently add new HubL functions/tags pulled from the HubSpot API.
                      // All other tools: flag on MAJOR version change only.
                      const MINOR_VERSIONED = new Set(['hubspot-cms-vscode']);

                      function isStale(tool, writtenVer, currentVer) {
                        if (MINOR_VERSIONED.has(tool)) {
                          const [wMaj, wMin] = String(writtenVer).split('.').map(Number);
                          const [cMaj, cMin] = String(currentVer).split('.').map(Number);
                          return cMaj > wMaj || (cMaj === wMaj && cMin > wMin);
                        }
                        return currentVer.split('.')[0] !== String(writtenVer).replace(/[^0-9].*/, '');
                      }

                      // Build comparison table
                      let table = '| Skill | Written | Tool | Written against | Current upstream |\n';
                      table    += '|---|---|---|---|---|\n';
                      for (const r of rows) {
                        const skip = r.current === 'no source' || r.current.startsWith('error:');
                        const flag = !skip && isStale(r.tool, r.writtenVersion, r.current) ? ' ⚠️' : '';
                        table += `| \`${r.skill}\` | ${r.writtenDate ?? '—'} | \`${r.tool}\` | \`${r.writtenVersion}\` | \`${r.current}\`${flag} |\n`;
                      }

                      const staleCount = rows.filter(r =>
                        r.current !== 'no source' &&
                        !r.current.startsWith('error:') &&
                        isStale(r.tool, r.writtenVersion, r.current)
                      ).length;

                      const summary = staleCount > 0
                        ? `⚠️ **${staleCount} tool(s) have drifted** beyond the version the skill was written against.`
                        : '✅ All tracked tools are within the expected version range of when the skills were written.';

                      const body = [
                        `## Skill version freshness — ${date}`,
                        '',
                        summary,
                        '',
                        'A ⚠️ flag means the upstream version has advanced beyond `written_against`. Review the skill and update its `written_against` and `written` fields after refreshing.',
                        '',
                        '**Staleness rules:**',
                        '- `hubspot-cms-vscode` — flag on minor version bump (extension minor releases add new HubL functions/tags)',
                        '- All other tools — flag on major version bump',
                        '',
                        'Rows showing `no source` (e.g. `hubspot-api`) have no public release feed and must be checked manually.',
                        '',
                        table,
                        '',
                        '---',
                        '*Auto-updated weekly by the [version-check workflow](../../actions/workflows/version-check.yml). Trigger a manual run from the Actions tab at any time.*',
                      ].join('\n');

                      const LABEL = 'skill-freshness';

                      // Ensure the label exists
                      try {
                        await github.rest.issues.createLabel({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          name: LABEL,
                          color: 'E4E669',
                          description: 'Automated skill version freshness tracking',
                        });
                      } catch { /* label already exists */ }

                      // Find an existing open issue with this label
                      const { data: existing } = await github.rest.issues.listForRepo({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        labels: LABEL,
                        state: 'open',
                        per_page: 1,
                      });

                      let issueNumber;
                      if (existing.length) {
                        await github.rest.issues.update({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: existing[0].number,
                          title: 'Skill version freshness report',
                          body,
                        });
                        issueNumber = existing[0].number;
                        core.info(`Updated issue #${issueNumber}`);
                      } else {
                        const { data: created } = await github.rest.issues.create({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          title: 'Skill version freshness report',
                          body,
                          labels: [LABEL],
                        });
                        issueNumber = created.number;
                        core.info(`Created issue #${issueNumber}`);
                      }

                      // Post a comment on every run so the issue has a visible
                      // history of how the stale count changed over time.
                      await github.rest.issues.createComment({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: issueNumber,
                        body: `**Weekly check — ${date}**\n\n${summary}`,
                      });
